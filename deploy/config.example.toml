# Example configuration for Orange You Glad.
# Install as /etc/orange-you-glad.toml. Every key is optional except library_root;
# the values shown are the defaults.

# Directory whose immediate subfolders are "subjects" (each holds that subject's photos).
# library_root = "/var/lib/orange-you-glad/photos"

# Seconds each collage stays on screen before the next one fades in.
# interval_secs = 300

# Number of photo tiles per collage.
# tiles = 6

# Gap between tiles, in pixels. 0 (the default) makes the tiles meet with no gaps.
# gap_px = 0

# Duration of the cross-fade between collages, in milliseconds.
# fade_ms = 1500

# Background colour shown in the gaps, as [red, green, blue], each 0-255.
# background = [0, 0, 0]

# Framebuffer device to draw on.
# framebuffer = "/dev/fb0"
