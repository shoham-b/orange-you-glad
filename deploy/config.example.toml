# Example configuration for Orange You Glad.
# Install as /etc/orange-you-glad.toml. Every key is optional except library_root;
# the values shown are the defaults.

# Directory mirroring the Drive folder: Config/subjects.json (subject name -> list of uuids)
# and, unless remote is set below, Processed/<uuid>.<ext> (the pictures).
# library_root = "/var/lib/orange-you-glad/photos"

# rclone folder holding Processed/. When set, only the pictures of the next collage are downloaded
# (to a temporary folder, deleted once the collage is built), and library_root needs just Config/.
# Leave unset to read the pictures from library_root/Processed. The deployed units expect it set.
# remote = "gdrive:"

# Seconds each collage stays on screen before the next one fades in.
# interval_secs = 300

# Number of photo tiles per collage.
# tiles = 6

# Gap between tiles, in pixels. 0 (the default) makes the tiles meet with no gaps.
# gap_px = 0

# Duration of the cross-fade between collages, in milliseconds.
# fade_ms = 1500
# moment_chance = 0.25

# Background colour shown in the gaps, as [red, green, blue], each 0-255.
# background = [0, 0, 0]

# Framebuffer device to draw on.
# framebuffer = "/dev/fb0"
