[package]
name = "orange-you-glad"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Photo-collage slideshow with cross-fades for a TV, drawing straight to the Linux framebuffer"
license = "MIT"
repository = "https://github.com/shoham-b/orange-you-glad"
readme = "README.md"
keywords = ["slideshow", "photo", "collage", "framebuffer", "raspberry-pi"]
categories = ["multimedia::images", "command-line-utilities"]

[lib]
bench = false

[[bin]]
name = "orange-you-glad"
path = "src/main.rs"
bench = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
dhat = "0.3.3"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
needless_pass_by_value = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "library"
harness = false

[[bench]]
name = "display"
harness = false

[[bench]]
name = "fade"
harness = false

[[bench]]
name = "collage"
harness = false

# Generic image code is compiled in this crate, so dependency-only optimization is not enough:
# at opt-level 0 the 12 MP decode/resize tests take half a minute.
[profile.dev]
opt-level = 2
