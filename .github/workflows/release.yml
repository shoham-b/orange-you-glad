name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  TARGET: aarch64-unknown-linux-gnu

jobs:
  build:
    name: build aarch64 binary
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64
      - run: cargo build --release --locked --target "$TARGET"
      - name: Package
        run: |
          name="orange-you-glad-${GITHUB_REF_NAME}-${TARGET}"
          mkdir "$name"
          cp "target/${TARGET}/release/orange-you-glad" LICENSE README.md "$name/"
          cp -r deploy "$name/deploy"
          tar -czf "${name}.tar.gz" "$name"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
          generate_release_notes: true
